[project]
name = "live2d-pipeline"
version = "0.1.0"
description = "Local, versioned AIGC to Live2D pipeline"
requires-python = ">=3.12,<3.14"
dependencies = ["typer>=0.16,<1", "pydantic>=2.11,<3", "httpx>=0.28,<1", "Pillow>=12.3,<13", "psd-tools>=1.10,<2", "jsonschema>=4.23,<5", "mcp>=1.12,<2", "huggingface-hub>=0.34,<2", "starlette>=1.6,<2", "uvicorn>=0.52,<1", "python-multipart>=0.0.32,<0.1"]
[project.scripts]
l2d = "live2d_pipeline.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
